# Publish trigger workflow.
# The `jsr-publish` tag refreshes a branch-capable publish trigger.
# The `jsr-publish-main` tag refreshes a strict main-only publish trigger.
# Package versions remain the provenance/release identity.
name: jsr

on:
  push:
    tags:
      - jsr-publish
      - jsr-publish-main
  workflow_dispatch:

concurrency:
  group: jsr-publish
  cancel-in-progress: false

jobs:
  publish_0:
    name: "jsr-1/14: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC/ID token is used for authentication with JSR.
    environment: dev
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "@sys/types"
            path: "code/sys/types"
            version: "0.0.296"
    steps:
      - uses: actions/checkout@v5
      - name: Verify clean checkout
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: 'Install ESM Runtime: Deno 2.x'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install Dependencies
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
              if deno task install; then
                exit 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "dependency install failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                sleep "$delay"
              fi
          done
          echo "dependency install failed after $max_attempts attempts"
          exit 1
      - name: Verify clean dependency install
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: Workspace Info
        run: deno task info
      - name: Deno Info
        run: deno info && deno --version
      - name: Validate main-only publish commit
        if: github.ref_name == 'jsr-publish-main'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: publish module → "${{ matrix.name }}"
        run: |
          cd "${{ matrix.path }}"
          expected_pkg_name="${{ matrix.name }}"
          expected_pkg_version="${{ matrix.version }}"
          pkg_name="$(deno eval "const c = JSON.parse(await Deno.readTextFile('deno.json')); console.log(c.name)")"
          pkg_version="$(deno eval "const c = JSON.parse(await Deno.readTextFile('deno.json')); console.log(c.version)")"
          if [ "$pkg_name" != "$expected_pkg_name" ]; then
            echo "::error::Generated JSR workflow package name is stale: expected ${expected_pkg_name}, found ${pkg_name}"
            exit 1
          fi
          if [ "$pkg_version" != "$expected_pkg_version" ]; then
            echo "::error::Generated JSR workflow package version is stale: expected ${expected_pkg_version}, found ${pkg_version}"
            exit 1
          fi
          pkg_meta_url="https://jsr.io/${pkg_name}/${pkg_version}_meta.json"
          pkg_index_url="https://jsr.io/${pkg_name}/meta.json"
          publish_timeout="90s"
          publish_confirm_timeout=900
          publish_confirm_interval=15
          jsr_exact_metadata_visible() {
            curl --fail --silent --location --max-time 30 --head "$pkg_meta_url" >/dev/null
          }
          jsr_package_index_visible() {
            deno eval '
              const [url, version] = Deno.args;
              const res = await fetch(url, {
                cache: "reload",
                headers: { "cache-control": "no-cache", pragma: "no-cache" },
              });
              if (!res.ok) Deno.exit(1);
              const data = await res.json();
              Deno.exit(data?.versions?.[version] ? 0 : 1);
            ' "$pkg_index_url" "$pkg_version" >/dev/null
          }
          wait_for_jsr_version() {
            elapsed=0
            exact_reported=0
            index_reported=0
            while [ "$elapsed" -le "$publish_confirm_timeout" ]; do
              if jsr_exact_metadata_visible; then
                if [ "$exact_reported" -eq 0 ]; then
                  echo "JSR exact metadata is visible: ${pkg_name}@${pkg_version}"
                  exact_reported=1
                fi
                if jsr_package_index_visible; then
                  if [ "$index_reported" -eq 0 ]; then
                    echo "JSR package index confirms published version: ${pkg_name}@${pkg_version}"
                    index_reported=1
                  fi
                  return 0
                elif [ "$index_reported" -eq 0 ]; then
                  echo "JSR exact metadata is visible, waiting for package index visibility: ${pkg_name}@${pkg_version}"
                  index_reported=1
                fi
              fi
              if [ "$elapsed" -ge "$publish_confirm_timeout" ]; then
                break
              fi
              sleep "$publish_confirm_interval"
              elapsed=$((elapsed + publish_confirm_interval))
            done
            return 1
          }
          deno task test --frozen
          git status --short
          test -z "$(git status --porcelain)"
          if jsr_exact_metadata_visible; then
            if wait_for_jsr_version; then
              echo "published version already has full JSR registry visibility: ${pkg_name}@${pkg_version}"
              exit 0
            fi
            echo "::error::Published version metadata exists, but JSR registry visibility was not confirmed: ${pkg_name}@${pkg_version}"
            exit 1
          fi
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
              if jsr_exact_metadata_visible; then
                if wait_for_jsr_version; then
                  echo "published version already has full JSR registry visibility: ${pkg_name}@${pkg_version}"
                  exit 0
                fi
                echo "::error::Published version metadata exists, but JSR registry visibility was not confirmed: ${pkg_name}@${pkg_version}"
                exit 1
              fi
              if timeout --foreground --kill-after=30s "$publish_timeout" deno publish; then
                echo "deno publish exited successfully; confirming JSR registry visibility..."
                if wait_for_jsr_version; then
                  echo "JSR registry confirms published version: ${pkg_name}@${pkg_version}"
                  exit 0
                fi
                echo "::error::deno publish exited successfully, but JSR registry visibility was not confirmed: ${pkg_name}@${pkg_version}"
                exit 1
              else
                status=$?
              fi
              if [ "$status" -eq 124 ]; then
                echo "deno publish reached bounded wait (${publish_timeout}, exit code 124); checking JSR registry visibility..."
              else
                echo "deno publish exited with code ${status}; checking JSR registry visibility before retry/fail..."
              fi
              if wait_for_jsr_version; then
                echo "JSR registry confirms published version: ${pkg_name}@${pkg_version}; treating publish as successful."
                exit 0
              fi
              if jsr_exact_metadata_visible; then
                echo "::error::Published version metadata exists, but JSR registry visibility was not confirmed: ${pkg_name}@${pkg_version}"
                exit 1
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "JSR registry did not confirm published version after attempt $attempt/$max_attempts; retrying in ${delay}s..."
                sleep "$delay"
              fi
          done
          echo "::error::Publish failed: deno publish did not complete successfully and JSR registry did not confirm published version after $max_attempts attempts: ${pkg_name}@${pkg_version}"
          exit 1
