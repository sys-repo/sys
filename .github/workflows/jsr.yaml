# Publish trigger workflow.
# The `jsr-publish` tag refreshes a branch-capable publish trigger.
# The `jsr-publish-main` tag refreshes a strict main-only publish trigger.
# Package versions remain the provenance/release identity.
name: jsr
on:
  push:
    tags:
      - jsr-publish
      - jsr-publish-main
  workflow_dispatch:

jobs:
  deno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC/ID token is used for authentication with JSR.
    environment: dev
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Verify clean checkout
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: 'Install ESM Runtime: Deno 2.x'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0
      - name: Install Dependencies
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
              if deno task install; then
                exit 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "dependency install failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                sleep "$delay"
              fi
          done
          echo "dependency install failed after $max_attempts attempts"
          exit 1
      - name: Verify clean dependency install
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: Workspace Info
        run: deno task info
      - name: Deno Info
        run: deno info && deno --version
      - name: Validate main-only publish commit
        if: github.ref_name == 'jsr-publish-main'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: publish module → "@sys/color"
        run: |
          cd code/sys/color
          expected_pkg_name="@sys/color"
          expected_pkg_version="0.0.256"
          pkg_name="$(deno eval "const c = JSON.parse(await Deno.readTextFile('deno.json')); console.log(c.name)")"
          pkg_version="$(deno eval "const c = JSON.parse(await Deno.readTextFile('deno.json')); console.log(c.version)")"
          if [ "$pkg_name" != "$expected_pkg_name" ]; then
            echo "::error::Generated JSR workflow package name is stale: expected ${expected_pkg_name}, found ${pkg_name}"
            exit 1
          fi
          if [ "$pkg_version" != "$expected_pkg_version" ]; then
            echo "::error::Generated JSR workflow package version is stale: expected ${expected_pkg_version}, found ${pkg_version}"
            exit 1
          fi
          pkg_meta_url="https://jsr.io/${pkg_name}/${pkg_version}_meta.json"
          publish_timeout="8m"
          publish_confirm_timeout=180
          publish_confirm_interval=10
          jsr_version_exists() {
            curl --fail --silent --location --max-time 30 --head "$pkg_meta_url" >/dev/null
          }
          wait_for_jsr_version() {
            elapsed=0
            while [ "$elapsed" -le "$publish_confirm_timeout" ]; do
              if jsr_version_exists; then
                return 0
              fi
              if [ "$elapsed" -ge "$publish_confirm_timeout" ]; then
                break
              fi
              sleep "$publish_confirm_interval"
              elapsed=$((elapsed + publish_confirm_interval))
            done
            return 1
          }
          deno task test --frozen
          git status --short
          test -z "$(git status --porcelain)"
          if jsr_version_exists; then
            echo "published version already exists on JSR: ${pkg_name}@${pkg_version}"
            exit 0
          fi
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
              if jsr_version_exists; then
                echo "published version already exists on JSR: ${pkg_name}@${pkg_version}"
                exit 0
              fi
              if timeout --foreground --kill-after=30s "$publish_timeout" deno publish; then
                exit 0
              else
                status=$?
              fi
              echo "publish command failed or timed out with exit code ${status}"
              if wait_for_jsr_version; then
                echo "publish completed on JSR despite local exit code: ${pkg_name}@${pkg_version}"
                exit 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "publish failed or timed out (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                sleep "$delay"
              fi
          done
          echo "publish failed after $max_attempts attempts"
          exit 1

