name: test:linux
on:
  push:
    branches:
      - main
      - phil-work
    paths-ignore:
      - .github/workflows/jsr.yaml

jobs:
  graph:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 'Install ESM Runtime: Deno 2.x'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install Dependencies
        run: deno task install
      - name: Verify workspace graph
        run: deno task check:graph
  deno:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: dev
    needs: graph
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@sys/driver-vite"
            path: code/sys.driver/driver-vite
            proofs: true
            cache: true
    steps:
      - uses: actions/checkout@v5
      - name: 'Install ESM Runtime: Deno 2.x'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install Dependencies
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
              if deno task install; then
                exit 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((5 * 2 ** (attempt - 1)))
                echo "dependency install failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                sleep "$delay"
              fi
          done
          echo "dependency install failed after $max_attempts attempts"
          exit 1
      - name: Workspace Info
        run: deno task info
      - name: Deno Info
        run: deno info && deno --version
      - name: 'Configure Browser Runtime: Chrome'
        if: ${{ matrix.browser == true }}
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              path="$(realpath -- "$(command -v "$bin")")"
              case "$path" in
                *','*|*$'\r'*|*$'\n'*)
                  echo "::error::Chrome executable path is unsafe for Deno permission transport"
                  exit 1
                  ;;
              esac
              if [ ! -f "$path" ] || [ ! -x "$path" ] || [ -L "$path" ]; then
                echo "::error::Chrome executable is not a canonical regular executable"
                exit 1
              fi
              printf 'CHROME_BIN=%s\n' "$path" >> "$GITHUB_ENV"
              "$path" --version
              exit 0
            fi
          done
          echo "::error::Chrome/Chromium runtime not found"
          exit 1

      - name: cache test dependencies → "${{ matrix.name }}"
        if: ${{ matrix.cache == true }}
        run: |
          cd ${{ matrix.path }}
          deno task test:cache

      - name: test module → "${{ matrix.name }}"
        run: |
          cd ${{ matrix.path }}
          deno task test

      - name: proof test module → "${{ matrix.name }}"
        if: ${{ matrix.proofs == true }}
        run: |
          cd ${{ matrix.path }}
          deno task test:proofs

      - name: browser test module → "${{ matrix.name }}"
        if: ${{ matrix.browser == true }}
        run: |
          cd ${{ matrix.path }}
          deno task test:browser
