id: pkg
title: Package template
summary: |
  Scaffold a package inside an existing system workspace.

sections:
  - label: Rule
    items: |
      Use `pkg` for a new package directory inside an existing system workspace.
      The target must have a nearest ancestor `deno.json` with a `workspace` array.
      Do not use `pkg` to create a repo root; use `repo` first.
      Do not infer `--pkgName` from a folder unless the human confirms it.
      If package path and package name disagree, stop and ask.

  - label: Speech acts
    items: |
      add a package named <@scope/name>
      create a package under <workspace-path>
      scaffold a Deno package
      make a package at code/<namespace>/<name>
      add package <@scope/name> to the workspace

  - label: Slots
    items: |
      Required: `--dir <package-dir>`.
      Required: `--pkgName <@scope/name>`.
      Run from the workspace root when using a relative `<package-dir>`.
      `<package-dir>` resolves relative to the current working directory unless absolute.
      `<@scope/name>` is the intended package import/publish name.
      Ask when either slot is missing, ambiguous, or likely mistyped.

  - label: Command
    items: |
      Preview:
      `deno run -ERW jsr:@sys/tmpl --non-interactive --dir <package-dir> pkg`.
      Add `--pkgName <@scope/name> --dry-run`.
      Write:
      `deno run -ERW jsr:@sys/tmpl --non-interactive --dir <package-dir> pkg`.
      Add `--pkgName <@scope/name>`.
      Existing target with approval: add `--force`.
      Do not use `jsr:@sys/tmpl/pkg`.

  - label: Side effects
    items: |
      Creates package files including `deno.json`, `README.md`, `src/`, and scripts.
      Also creates test harness files and UI/fs subpath stubs.
      Replaces template placeholder `@sample/foo` with `--pkgName` across scaffolded files.
      Adds the package directory to the host workspace `deno.json` workspace array.
      Inserts the package directory into the host workspace `-scripts/-PATHS.ts` modules array.
      The new workspace entry leaves generated workspace graph/CI surfaces stale until repo prep runs.
      Workspace-level tasks may report `0 packages ordered` until refreshed.
      `--dry-run` previews copied files but does not run setup side effects.

  - label: Verify
    items: |
      Confirm `<package-dir>/deno.json` contains the requested package name.
      Confirm root workspace `deno.json` includes `<package-dir>` exactly once.
      Confirm the workspace entry is sorted with existing entries.
      Confirm root `-scripts/-PATHS.ts` includes `<package-dir>` exactly once.
      Confirm no `@sample/foo` placeholder remains under the new package.
      Run `deno task check` from the package directory for package-local type proof.
      MUST run `deno task prep` from the workspace root after package scaffold and before workspace-level CI.
      Then run workspace-level `deno task ci` or `deno task check` from the workspace root.
      Confirm the new package appears in "packages ordered".
      Package-local `deno task check` does not prove workspace graph freshness.
      If the workspace root cannot be found, stop and ask for the correct target.
