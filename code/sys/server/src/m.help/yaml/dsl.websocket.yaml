id: websocket
title: WebSocketServer
summary: |
  Use `WebSocketServer` from `@sys/server/websocket` to serve typed
  `@sys/event/cmd` handlers over Deno WebSockets.

sections:
  - label: Rule
    items: |
      Import the runtime value from `@sys/server/websocket`.
      The public value is `WebSocketServer`.
      The constructor is `WebSocketServer.create(...)`.
      Keep `src/m.server.websocket/mod.ts` export-only.
      Keep the Deno seam visible and truthful.
      The Deno seam is `Deno.serve` and `Deno.upgradeWebSocket`.
      The primitive owns WebSocket upgrade and command transport binding.
      The primitive owns lifecycle cleanup.
      It does not own app routing, sessions, auth, file grammar, UI, or a client SDK.

  - label: Speech acts
    items: |
      create a WebSocketServer
      serve typed commands at <path>
      choose hostname, port, and path for a WebSocket command endpoint
      accept only matching WebSocket upgrade requests
      return a custom rejection Response before upgrade
      inspect the accepted raw WebSocket
      publish local origin and WebSocket URL facts
      verify the public runtime import @sys/server/websocket

  - label: Construction
    items: |
      Call `WebSocketServer.create({ cmd, ...options })`.
      Required option: `cmd.handlers`.
      Optional network options: `hostname`, `port`, and `path`.
      Optional admission option: `accept(request)`.
      Optional raw escape hatch: `onSocket(context)`.
      Optional service metadata: `status`.
      Optional lifecycle boundary: `until`.
      Defaults belong in the websocket module defaults, not in consumers.

  - label: Admission
    items: |
      Non-WebSocket requests are rejected before upgrade.
      Path mismatches are rejected before upgrade.
      `accept` may return `false` to reject.
      `accept` may return a `Response` to return it directly.
      `accept` runs before `Deno.upgradeWebSocket`.
      `accept` should not consume request bodies.

  - label: Verify
    items: |
      Assert the public import:
      `const m = await import('@sys/server/websocket')`.
      Assert identity:
      `expect(m.WebSocketServer).to.equal(WebSocketServer)`.
      Prove a real WebSocket connection reaches typed command handlers.
      Prove non-upgrade, path mismatch, and custom rejection behavior.
      Do not verify by importing private `u.*` files from consumers.
