# Cell descriptor.

kind: cell
version: 1
name: sample:deploy

services:
  - name: deploy:view
    use: Serve
    from: 'jsr:@sys/tools/serve'
    config: ./-config/@sys.tools.serve/view.yaml

tasks:
  - name: deploy:prep
    use: DeployPrepTask
    from: ./-scripts/deploy.ts
    config: ./-config/@sys.tools.deploy/orbiter.yaml

  - name: deploy:push
    use: DeployPushTask
    from: ./-scripts/deploy.ts
    config: ./-config/@sys.tools.deploy/orbiter.yaml

  - name: sample:deploy:prep
    steps:
      - task: deploy:prep

  - name: sample:deploy
    steps:
      - task: sample:deploy:prep
      - task: deploy:push
