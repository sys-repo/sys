# Cell descriptor.

kind: cell
version: 1

actions:
  - name: pull:view
    from: ./-scripts/deploy.ts
    export: PullViewAction
    config: ./-config/@sys.tools.pull/view.yaml

  - name: deploy:stage
    from: ./-scripts/deploy.ts
    export: DeployStageAction
    config: ./-config/@sys.tools.deploy/stage.yaml

  - name: sample:deploy
    steps:
      - action: pull:view
      - action: deploy:stage
