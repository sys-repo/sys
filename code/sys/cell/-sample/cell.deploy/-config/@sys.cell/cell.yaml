# Cell descriptor.

kind: cell
version: 1

tasks:
  - name: pull:view
    use: PullViewTask
    from: ./-scripts/deploy.ts
    config: ./-config/@sys.tools.pull/view.yaml

  - name: deploy:prep
    use: DeployPrepTask
    from: ./-scripts/deploy.ts
    config: ./-config/@sys.tools.deploy/orbiter.yaml

  - name: deploy:push
    use: DeployPushTask
    from: ./-scripts/deploy.ts
    config: ./-config/@sys.tools.deploy/orbiter.yaml

  - name: sample:deploy:prep
    steps:
      - task: pull:view
      - task: deploy:prep

  - name: sample:deploy
    steps:
      - task: sample:deploy:prep
      - task: deploy:push
