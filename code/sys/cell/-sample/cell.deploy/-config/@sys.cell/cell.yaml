# Cell descriptor.

kind: cell
version: 1

tasks:
  - name: pull:view
    from: ./-scripts/deploy.ts
    use: PullViewTask
    config: ./-config/@sys.tools.pull/view.yaml

  - name: deploy:stage
    from: ./-scripts/deploy.ts
    use: DeployStageTask
    config: ./-config/@sys.tools.deploy/stage.yaml

  - name: sample:deploy
    steps:
      - task: pull:view
      - task: deploy:stage
