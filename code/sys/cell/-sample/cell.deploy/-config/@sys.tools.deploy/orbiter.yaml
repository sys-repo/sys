# Orbiter endpoint for the Cell deploy sample.
#
# Provider values resolve from `.env` using whole-scalar `${env:...}` refs.
# In this workspace, the sample resolves these from the repo-root `.env`.

provider:
  kind: orbiter
  siteId: ${env:SYS_CELL_DEPLOY_ORBITER_SITE_ID}
  domain: ${env:SYS_CELL_DEPLOY_ORBITER_DOMAIN}

source:
  dir: .

staging:
  dir: ./.tmp/deploy/orbiter
  clear: true

mappings:
  - mode: copy
    dir:
      source: view/.pulled/ui.components
      staging: .
