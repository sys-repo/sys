id: static-serve-service
title: Static serve service
summary: Add a static-file service backed by an `@sys/tools/serve` owner config.

sections:
  - label: Rule
    items: |
      Classify "add a static serve service for <dir>" as `add: static serve service`.
      Also classify "serve <dir> as a Cell service" as this act.
      Treat the speech act as intent plus partial slots.
      Cell records only the service binding and owner config reference.
      `@sys/tools/serve` is the blessed Cell DSL path for static-file serving.
      Do not use a direct `@sys/tools serve` CLI shortcut to bypass Cell services.
      Do not put static-serving mechanics directly in `cell.yaml`.
      Other service owners remain generic services; use their own help only when explicitly selected.

  - label: 'Slot policy'
    items: |
      `<dir>` is the static root; ask unless the user named it or the intended view path is obvious.
      `<service-name>` is a Cell descriptor service ID and must match `^[a-z][a-z0-9]*(?:[.:-][a-z0-9]+)*$`.
      Reject invalid service names such as `serve/static`, `StaticServe`, `serve_static`, or `bad..id`.
      `<service-name>` is semantic; propose `<area>:view` or `<area>:static` and confirm if not obvious.
      `<config>` is an owner config reference; propose `./-config/@sys.tools.serve/<profile>.yaml`.
      Do not derive config paths by embedding raw service IDs without confirmation.
      Use owner defaults for hostname and port unless the user specifies them.
      Confirm service name, serve config path, and static root before writing.

  - label: Dialogue
    items: |
      Do not restate the DSL contract to the user.
      Ask for missing semantic slots and confirm proposed owner paths.
      Example response for serving a static root as a Cell service:
      OK — I can add that static serve service.
      I’ll use:
      service name: `<service-name>`
      serve config: `<serve-config>`
      static root: `<dir>`
      Please confirm those values before I update the owner config and Cell descriptor.

  - label: 'Owner flow'
    items: |
      Use `@sys/tools/serve` as the service owner.
      `Serve.start` reads the selected serve-tool owner config from `paths.config`.
      Start from public `@sys/tools serve --help` if the owner config shape or options are unclear.
      Create or update only the confirmed serve-tool owner config.
      Do not shell to `@sys/tools serve` from a project task to preview a Cell service.
      Cell records only service name, `use`, `from`, and config reference.
      Cell starts the service through the normal service lifecycle.

  - label: 'Owner config'
    items: |
      # <serve-config>
      name: <service-name>
      dir: <dir>
      info:
        path: <optional-url-path>

  - label: 'Descriptor patch'
    items: |
      services:
        - name: <service-name>
          use: Serve
          from: 'jsr:@sys/tools/serve'
          config: <serve-config>
