id: dsl
title: Cell DSL
summary: |
  Cell DSL (domain-specific-language): the formal command/vocabulary surface for valid Cell edits.
  Read this root layer before changing a Cell folder; then read the matching chapter from the chapter index.

sections:
  - label: 'Agent reading protocol'
    items:
      - 'Agents MUST read this root DSL layer before changing a Cell folder: `deno run -ER jsr:@sys/cell dsl`.'
      - Agents MUST NOT read every chapter by default.
      - Agents MUST identify the intended speech act from Speech acts and Mappings.
      - 'Agents MUST read each matching chapter from the chapter index before editing: `deno run -ER jsr:@sys/cell dsl <chapter>`.'
      - If no chapter index entry matches, stop and ask.

  - label: Rule
    items: |
      Cell owns boot/composition, service orchestration, and Cell CLI terminal lifecycle.
      Owner configs own mechanics and state interpretation.
      `cell.yaml` names trusted services, finite tasks, and owner config references.
      Views are owner-defined projections that make Cell state perceivable.
      Tasks are finite workflow declarations; endpoint modules own execution mechanics.
      Do not register views or service-to-view relationships in `cell.yaml`.
      Do not put pull/service/proxy/mount/task mechanics in `cell.yaml`.
      Do not turn `cell.yaml` into a mega-config.

  - label: 'Descriptor IDs'
    items: |
      Service and task names in `cell.yaml` use the pattern `^[a-z][a-z0-9]*(?:[.:-][a-z0-9]+)*$`.
      Allowed separators are `.`, `:`, and `-` between lowercase alphanumeric segments.
      Do not use `_`, `/`, spaces, uppercase letters, leading/trailing separators, or repeated separators.
      Treat service and task names as opaque identifiers for display, logs, and review.
      Do not treat names as raw paths, URLs, import specifiers, Deno task names, or config filenames.
      Validate user-provided name slots before editing `cell.yaml`.
      If a requested name is invalid, stop and ask for a valid name; do not silently rewrite it.

  - label: Speech acts
    items:
      - initialize this folder as a Cell
      - add a pulled view from <dist-url>
      - pull latest configured views
      - add a static serve service for <dir>
      - add a service named <service-name> use <endpoint> from <module>
      - add a proxy service named <service-name>
      - add a leaf task named <task-name> use <endpoint> from <module>
      - add a local task adapter at <relative-task-module>
      - add a composite task named <task-name> from <step-task-names>
      - route / to <view/service/upstream>
      - route <path-prefix> to <view/service/upstream>
      - verify/load this Cell
      - run a finite task named <task-name>
      - start the Cell services

  - label: Owners
    items:
      - Cell config references owned configs.
      - Cell does not own their internals.
      - Start from public `--help` surfaces.
      - If public `jsr:@sys/... --help` output is missing, stale, or silent, retry once with `--reload` as a troubleshooting move.
      - If `--reload` fixes help, continue with normal non-`--reload` owner commands.
      - Do not hand-author owner YAML just because cached public help was stale.
      - Use owning CLI/API to create, validate, or execute config.
      - If no owner affordance exists, stop and ask.
      - If a selected endpoint contract is still ambiguous, inspect the published JSR package docs/source.
      - Use source inspection only to confirm public exports, types, and lifecycle contracts.
      - Do not use source inspection to bypass owner CLI/API config affordances.

  - label: Mappings
    items:
      - add pulled view → run `@sys/tools pull add` against confirmed owner config
      - owner pull config owns dist URL and local target
      - do not register pulled views in `cell.yaml`
      - pull latest configured views → run `@sys/tools pull` against confirmed pull config(s)
      - if no pull config is specified or known, ask for it
      - do not edit `cell.yaml` for refresh-only pulls
      - add static serve service → use the `@sys/tools/serve` service endpoint
      - "then register `services[]` with `name`, `use: Serve`, `from: '@sys/tools/serve'`, and `config`"
      - do not bypass Cell services with `@sys/tools serve --non-interactive` task shortcuts
      - add generic service → confirm `Cell.Services.LifecycleEndpoint`
      - local service adapter → keep adapter code under the Cell root, typically `./-services/*.ts`
      - use owner config affordance when available
      - then register `services[]` with `name`, `use`, `from`, and `config`
      - add proxy → use proxy owner flow
      - then register service name and config ref
      - root route → run `@sys/http/server/proxy root set`
      - mount route → run `@sys/http/server/proxy mount add`
      - add leaf task → confirm the endpoint exposes `run(args)` and owner config affordance when config is needed
      - local task adapter → keep adapter code under the Cell root, typically `./-tasks/*.ts`
      - task config → owner-owned ref resolved relative to the Cell root and passed as `paths.config`
      - leaf task descriptor → register `tasks[]` with `name`, `use`, `from`, and optional `config`
      - composite task descriptor → register `tasks[]` with `name` and `steps[]` task refs only
      - do not put shell commands, `deno task`, or inline executable fields in `tasks[].steps[]`
      - '`cell.yaml` only names services, finite tasks, endpoint refs, and owner config refs'
      - verify/load → run `Cell.load` against the folder
      - run finite task → run `@sys/cell task <task-name>`
      - start services → run `@sys/cell start`
