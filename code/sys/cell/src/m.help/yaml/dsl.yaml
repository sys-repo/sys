id: dsl
title: Cell DSL
summary: |
  Cell DSL (domain-specific-language): the formal command/vocabulary surface for valid Cell edits.
  Use these acts, owner rules, mappings, and chapters when changing a Cell folder.

sections:
  - label: Rule
    items: |
      Cell owns topology; owner configs own mechanics.
      Local files are ordinary Cell content; runtime services own how files are served or interpreted.
      Use chapters for detailed slot policy and owner flows.
      Do not put pull/service/proxy/mount mechanics in `cell.yaml`.
      Do not turn `cell.yaml` into a mega-config.

  - label: 'Topology IDs'
    items: |
      Cell topology identifiers use the pattern `^[a-z][a-z0-9.-]*$`.
      This applies to view names, service names, service kinds, and view references.
      Allowed characters are lowercase letters, digits after the first character, `.` and `-`.
      Do not use `:`, `_`, `/`, spaces, or uppercase letters in Cell topology IDs.
      Validate user-provided topology ID slots before editing `cell.yaml`.
      If a requested ID is invalid, stop and ask for a valid ID; do not silently rewrite it.

  - label: Speech acts
    items:
      - initialize this folder as a Cell
      - add a pulled view from <dist-url>
      - pull latest configured views
      - add an @sys/http static service for <view>
      - add a service named <service-name> using <@scope/pkg>/<export>
      - add a proxy service named <service-name>
      - route / to <view/service/upstream>
      - route <path-prefix> to <view/service/upstream>
      - verify/load this Cell
      - start the Cell runtime

  - label: Owners
    items:
      - Cell config references owned configs.
      - Cell does not own their internals.
      - Start from public `--help` surfaces.
      - If public `jsr:@sys/... --help` output is missing, stale, or silent, retry once with `--reload` as a troubleshooting move.
      - If `--reload` fixes help, continue with normal non-`--reload` owner commands.
      - Do not hand-author owner YAML just because cached public help was stale.
      - Use owning CLI/API to create, validate, or execute config.
      - If no owner affordance exists, stop and ask.
      - If a module/export contract is still ambiguous, inspect the published JSR package docs/source.
      - Use source inspection only to confirm public exports, types, and lifecycle contracts.
      - Do not use source inspection to bypass owner CLI/API config affordances.

  - label: Mappings
    items:
      - add pulled view → run `@sys/tools pull add`
      - then register `views.<name>.source.pull`
      - pull latest configured views → run `@sys/tools pull`
      - use each distinct `views.*.source.pull` config
      - do not edit `cell.yaml` for refresh-only pulls
      - add @sys/http static service → run `@sys/http/server/static config add`
      - "then register `runtime.services[]` with `from: '@sys/http/server/static'` and `export: HttpStatic`"
      - do not use `@sys/tools serve` for Cell runtime static services
      - add generic runtime service → confirm `Cell.Runtime.LifecycleEndpoint`
      - use owner config affordance when available
      - then register `runtime.services[]`
      - add proxy → use proxy owner flow
      - then register runtime service and config ref
      - root route → run `@sys/http/server/proxy root set`
      - mount route → run `@sys/http/server/proxy mount add`
      - '`cell.yaml` only names the proxy service and config ref'
      - verify/load → run `Cell.load` against the folder
      - start runtime → run `@sys/cell start`
