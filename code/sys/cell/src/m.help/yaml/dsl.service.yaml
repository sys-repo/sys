id: service
title: Service
summary: Add a trusted lifecycle service backed by a service-owned config.

sections:
  - label: Rule
    items: |
      Classify prompt shape:
      "add a service named <service-name> from <module> use <endpoint>"
      as `add: service`.
      Cell records service composition.
      The service owner owns config schema and mechanics.
      Service imports must be trusted by `Cell.Services.verify/start`.
      The default trusted prefix is `@sys/`.
      Do not put service config internals directly in `cell.yaml`.
      Do not hand-author owner YAML when the owner CLI/API can write it.

  - label: 'Slot policy'
    items: |
      `<service-name>` is semantic; examples: `worker`, `api`, `dev:fixture`, `app.proxy-v1`.
      `<service-name>` is a Cell descriptor service ID and must match `^[a-z][a-z0-9]*(?:[.:-][a-z0-9]+)*$`.
      Reject invalid service names such as `service/path`, `BadService`, `worker_1`, or `bad..id`.
      Treat service names as opaque identifiers for display, logs, and review.
      Do not treat service names as raw paths, URLs, imports, task names, or config filenames.
      `<module>` is a trusted import specifier or Cell-local relative adapter path.
      Module examples: `@scope/pkg`, `@scope/pkg/server`, `@scope/pkg/service`, `./-services/local.ts`.
      `<endpoint>` is the named ESM binding selected by `use` that implements `Cell.Services.LifecycleEndpoint`.
      Endpoint examples: `Server`, `Worker`, `Service`, `Fixture`.
      `<config>` is a Cell-relative owner config path.
      Config examples: `./-config/@scope.pkg/service.yaml`.
      Config examples: `./-config/@scope.pkg/default.yaml`.
      Do not derive config paths by embedding raw service IDs without confirmation.
      Confirm service name, from/use endpoint ref, and config path.

  - label: 'Lifecycle contract'
    items: |
      The selected endpoint must implement `Cell.Services.LifecycleEndpoint`.
      `Cell.Services.LifecycleEndpoint` exposes `start(args)`.
      Cell resolves the service-owned config ref, then calls `start(args)`.
      Base args include the Cell root and the service-owned config reference.
      Service adapters must accept those base args directly; Cell does not rewrite endpoint args.
      Cell does not derive args from service kind or view links.
      The started handle should expose `close(reason)` or `dispose(reason)` for Cell shutdown.
      Standard full @sys lifecycle handles can be `t.LifecycleAsync` compatible.
      If the from/use endpoint contract is ambiguous, inspect the published JSR package docs/source.
      Use source inspection only to confirm public exports, types, and lifecycle contracts.

  - label: Dialogue
    items: |
      Do not restate the DSL contract to the user.
      Ask for missing semantic slots and confirm proposed owner paths.
      Example response for adding a generic trusted service:
      OK — I can add that service.
      I’ll use:
      service name: `<service-name>`
      from/use: `<module>` / `<endpoint>`
      config: `<config>`
      Please confirm those values before I update the Cell descriptor
      or create service-owned config.

  - label: 'Owner flow'
    items: |
      Start with owner help for `<module>`.
      Run `deno run -E jsr:<module> --help` when `<module>` is a JSR CLI entrypoint.
      Use the exact import specifier confirmed for the owner.
      Add permissions only when owner help says they are required.
      Check for owner config affordances such as `config` or `config add`.
      Also check for owner-specific create/update commands.
      Use owner CLI/API to create, validate, or update `<config>` when available.
      If no owner affordance exists, stop and ask before hand-authoring owner config YAML.
      Do not duplicate the owner config schema in the Cell edit.
      Cell records only the service and config reference.

  - label: 'Descriptor patch'
    items:
      - |
          services:
            - name: <service-name>
              from: '<module>'
              use: <endpoint>
              config: <config>
