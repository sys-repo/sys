summary: |
  A Cell is a folder-shaped metamedium whose DSL stores
  meaning and whose meaning can be interpreted, viewed, and
  validly rewritten within the folder that bounds it.

usage:
  - deno run -ER   jsr:@sys/cell --help
  - deno run -ERW  jsr:@sys/cell init [dir]
  - deno run -ER   jsr:@sys/cell dsl [chapter...] [--format human|skill]
  - deno run -ERWN jsr:@sys/cell start [dir]

commands:
  - name: init
    text: initialize a folder as a Cell
  - name: dsl
    text: show Cell speech acts, owner rules, and chapters
  - name: start
    text: start the Cell runtime

options:
  - name: -h, --help
    text: show help
