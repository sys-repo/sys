summary: |
  Break-glass cleanup for Cell start sessions.
  Sends process signals only to trusted, fresh session supervisors
  registered for the selected Cell root and mode scope.

usage:
  - deno run -ERW --allow-run jsr:@sys/cell kill [dir]
  - deno run -ERW --allow-run jsr:@sys/cell kill [dir] --mode <mode>
  - deno run -ERW --allow-run jsr:@sys/cell kill [dir] --dry-run
  - deno run -ERW --allow-run jsr:@sys/cell kill [dir] --force
  - deno run -ERW --allow-run jsr:@sys/cell kill [dir] --help

options:
  - name: -h, --help
    text: show kill help
  - name: --mode <mode>
    text: target only sessions started with the selected service graph mode
  - name: --dry-run
    text: >-
      show matching sessions without sending signals
      or removing stale records
  - name: --force
    text: >-
      use hard termination for trusted fresh sessions;
      stale-heartbeat sessions are still skipped

safety:
  - Cell kill targets runtime sessions for one canonical Cell root.
  - It is not a port killer or a process-name killer.
  - >-
    With no `[dir]`, Cell discovers the nearest Cell root
    from the current directory.
  - With no `--mode`, Cell targets all live sessions for the root.
  - >-
    A fresh session heartbeat is required before sending a signal
    to a running pid.
  - Stale records for dead pids are removed unless `--dry-run` is set.
  - Stale running sessions are reported and skipped, even with `--force`.
