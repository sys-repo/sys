id: start-services
title: Start services
summary: Start composed Cell services from a Cell folder.

sections:
  - label: Rule
    items: |
      Classify "start the Cell services" as `start services`.
      Start is an operator operation, not a config mutation.
      Cell orchestrates services; owner packages own serving behavior and display.
      Do not write a custom launcher script unless explicitly asked.
      Do not edit `cell.yaml` just to start already configured services.

  - label: 'Operator flow'
    items: |
      Use Cell CLI: `@sys/cell start [dir]`.
      Pass `[dir]` when the Cell root is not the current folder.
      Use this chapter to start already-declared services; read `dsl service` before adding or changing variants.
      Pass `--mode <mode>` only to select complete service variants already declared in the descriptor.
      For live dev, a common shape is `--mode dev` selecting an owner endpoint such as `jsr:@sys/driver-vite/service` / `ViteService`.
      Start loads the Cell descriptor, starts declared `services[]`, waits, and closes services.
      If startup fails for a named service, inspect that service's owner config and owner `--help`.
      If a selected endpoint contract is ambiguous, inspect the published JSR package docs/source.

  - label: Command
    items: |
      deno run -ERWN jsr:@sys/cell start [dir]
      deno run -ERWN jsr:@sys/cell start [dir] --mode <mode>
      deno run -ERWN jsr:@sys/cell start . --mode dev

  - label: 'Project task'
    items: |
      Add a project task only when the user asks for a persistent convenience command.
      Use the public Cell CLI as the stable primitive.
      Example `deno.json` task shape:
      "start": "deno run -ERWN jsr:@sys/cell start ."

  - label: Services
    items: |
      `@sys/cell start` loads the descriptor, starts selected services, then waits.
      At start time, `--mode <mode>` selects matching `variants.<mode>` before endpoints are imported.
      Mode selection preserves one conceptual service identity; services without the selected variant keep their base binding.
      Mode is a Cell selection key, not an owner-service setting. It is not forwarded.
      Cell chooses the complete binding, then starts that endpoint through the normal lifecycle contract.
      `Cell.Services.wait` waits for started service handles that expose `finished`.
      Services that should keep `@sys/cell start` alive should return a started handle with `finished`.
      Service owners keep config schema, mechanics, ports, URLs, permissions, serving strategy, Vite/HMR behavior, and display.
      Cell may render the selected mode and endpoint. It does not own Vite, HMR, static-serving, or owner config semantics.
      Do not claim full browser HMR unless a browser-backed edit/update proof exists.
      Add any extra permissions required by declared owner services.
      Cell closes started services when service wait completes or startup fails.
