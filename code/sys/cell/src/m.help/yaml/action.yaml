summary: |
  Run a named trusted Cell action from a finite `actions[]` graph.
  Loads `cell.yaml`, verifies declared action endpoints, and executes the named root action.

usage:
  - deno run -ERWN jsr:@sys/cell action <name> [dir]
  - deno run -ERWN jsr:@sys/cell action <name> [dir] --help

options:
  - name: -h, --help
    text: show action help

action:
  - Cell loads `[dir]` or `.` as the Cell root.
  - Cell verifies actions declared in `actions[]` before execution.
  - Root actions are runnable by name.
  - Leaf actions resolve Cell-local or trusted package endpoints with `run(args)`.
  - Composite actions run referenced root actions in declared order.
  - 'Leaf actions receive structured args: `{ cwd, config?, paths: { config? } }`.'
  - Cell does not prove leaf endpoint termination; owner action code controls its own runtime.
  - Cell does not print owner action results, to avoid leaking secrets or bulky payloads.
  - Add any extra permissions required by declared owner actions.
