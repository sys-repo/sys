summary: |
  Start Cell services from a Cell folder.
  Loads `cell.yaml`, starts declared services, and waits for service completion.

usage:
  - deno run -ERWN jsr:@sys/cell start [dir]
  - deno run -ERWN jsr:@sys/cell start [dir] --help

options:
  - name: -h, --help
    text: show start help

services:
  - Cell loads `[dir]` or `.` as the Cell root.
  - Cell starts services declared in `services[]`.
  - Service owners keep their own config schema, mechanics, and display.
  - Add any extra permissions required by declared owner services.
  - Cell calls `Cell.Services.wait` for started service handles that expose `finished`.
  - Services that should keep `@sys/cell start` alive should return a started handle with `finished`.
  - Cell closes started services when service wait completes or startup fails.
