id: pulled-view
title: Pulled view
summary: Add a view backed by an `@sys/tools/pull` config.

sections:
  - label: Rule
    items: |
      Classify "add a pulled view from <dist-url>" as `add: pulled view`.
      Classify "pull latest configured views" as `refresh: pulled views`.
      Treat add prompts as intent plus partial slots.
      Treat refresh prompts as owner materialization, not Cell descriptor edits.
      Do not guess missing values.
      Configure first; materialize only when needed or approved.

  - label: 'Slot policy'
    items: |
      `<dist-url>` is given by the prompt.
      Ask for `<name>`; view names are semantic/user-facing owner handles.
      `<name>` is not a Cell descriptor field.
      Prefer lowercase segmented names for owner-facing handles.
      Avoid `_`, `/`, spaces, uppercase letters, and path-like values in view handles.
      Do not derive `<name>` from the URL.
      Do not use a raw view handle as a path segment without confirming concrete owner paths.
      Propose pull config: `./-config/@sys.tools.pull/view.yaml`.
      Propose local target: `./view/.pulled/<dist-name>`.
      Do not ask for a destination path when only `<dist-url>` is missing context.
      Confirm proposed paths before writing.
      If the user confirms alternate paths, use those confirmed values.
      Derive `<dist-name>` from the URL segment before `dist.json`.

  - label: 'Dialogue'
    items:
      - Do not restate the DSL contract to the user.
      - Ask for the missing semantic slot and confirm proposed paths.
      - Do not present the proposed local target as a required user operand.
      - |-
        Example response when the prompt supplies `<dist-url>` but not `<name>`:
        OK — I can get that pulled view ready.
        I’ll use:
        dist URL: `<dist-url>`
        pull config: `<pull-config-path>`
        local target: `<local-target>`
        Please confirm those paths and tell me the view name to use.

  - label: 'Owner flow'
    items: |
      Use owner CLI: `@sys/tools pull add`.
      Pass `--config <pull-config-path>`.
      Pass `--dist <dist-url>`.
      Pass `--local <local-target>`.
      This creates or updates pull config.
      Do not hand-author `@sys/tools/pull` YAML.
      Use owner CLI when it can create config.
      Owner pull config records `<dist-url>` and `<local-target>`.
      Pulled-view setup does not change the Cell descriptor.
      Do not put `<dist-url>`, `<local-target>`, or view registry entries in `-cell/cell.yaml`.

  - label: 'Materialize'
    items:
      - Pull add configures only; it does not pull files.
      - Materialize only when needed or approved.
      - 'For `refresh: pulled views`, use confirmed pull config path(s).'
      - >-
        If the prompt does not identify pull config(s) and no project convention is established,
        ask.
      - Run one materialization per distinct pull config.
      - 'Use owner CLI: `@sys/tools pull`.'
      - Pass `--non-interactive`.
      - Pass `--config <pull-config-path>`.
      - Do not read `views.*` from `-cell/cell.yaml`.
      - Do not edit `-cell/cell.yaml` for refresh-only pulls.
