id: static-http-service
title: Static HTTP service
summary: Add an @sys/http static service backed by `@sys/http/server/static` config.

sections:
  - label: Rule
    items: |
      Classify "add an @sys/http static service for <view>" as `add: static HTTP service`.
      Also classify "add a static HTTP service for <view>" as this act, then route to @sys/http.
      Treat the speech act as intent plus partial slots.
      Cell registers a service name, from/use endpoint ref, and owner config reference.
      Do not hand-author `@sys/http` config YAML when the owner CLI can write it.
      Do not put HTTP static-server mechanics directly in `cell.yaml`.
      Do not use `@sys/tools serve` for Cell services; it is an operator CLI façade.

  - label: 'Slot policy'
    items: |
      `<view>` is an owner-defined projection/static root the service serves; ask if missing or ambiguous.
      `<view>` is not a Cell descriptor field.
      `<service-name>` is a Cell descriptor service ID and must match `^[a-z][a-z0-9]*(?:[.:-][a-z0-9]+)*$`.
      Reject invalid service names such as `http/static`, `HttpStatic`, `http_static`, or `bad..id`.
      `<service-name>` is semantic; propose `ui:static:<view>` and confirm if not obvious.
      `<config>` is an owner config reference; propose a concrete path such as `./-config/@sys.http/static/<view>.yaml`.
      Do not derive config paths by embedding raw service IDs without confirmation.
      `<dir>` is the static root; ask unless the user named it or the view path is obvious.
      Use owner defaults for hostname and port unless the user specifies them.
      Confirm proposed service name, config path, and static root before writing.

  - label: Dialogue
    items: |
      Do not restate the DSL contract to the user.
      Ask for missing semantic slots and confirm proposed owner paths.
      Example response for serving a declared view from a static root:
      OK — I can add that static HTTP service.
      I’ll use:
      service name: `<service-name>`
      static config: `<static-config>`
      static root: `<dir>`
      Please confirm those values before I run the owner command and update the Cell descriptor.

  - label: 'Owner flow'
    items: |
      Use owner CLI: `@sys/http/server/static config add`.
      Do not use `@sys/tools serve`; it does not own this Cell service config.
      Pass `--config <config>`.
      Pass `--dir <dir>`.
      Pass `--hostname` and `--port` only when specified or confirmed.
      This creates or updates HTTP static-server config.
      Do not duplicate HTTP config schema in the Cell edit.
      Cell records only service name, from/use endpoint ref, and config reference.

  - label: 'Owner command'
    items:
      - Command templates; replace placeholders with confirmed slot values.
      - |
          deno run -ERW jsr:@sys/http/server/static config add \
            --config <static-config> \
            --dir <dir>
      - |
          deno run -ER jsr:@sys/http/server/static config add \
            --dry-run \
            --config <static-config> \
            --dir <dir> \
            --hostname <hostname> \
            --port <port>

  - label: 'Descriptor patch'
    items: |
      services:
        - name: <service-name>
          from: '@sys/http/server/static'
          use: HttpStatic
          config: <static-config>
