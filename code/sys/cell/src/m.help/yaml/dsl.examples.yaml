id: examples
title: Cell DSL examples
summary: |
  Resolve incomplete or ambiguous slots after matching a Cell speech act.

sections:
  - label: Rule
    items:
      - >-
          Use this chapter only after the prompt resembles a Cell DSL speech act but slots are
          incomplete or informal.
      - These are sample slot values, not DSL grammar, defaults, or required values.
      - Confirm missing values before editing owner configs or `-config/@sys.cell/cell.yaml`.
      - Do not inspect implementation source just to infer these examples.

  - label: Prompt shapes
    items:
      - A prompt mentioning `fs.db.team` may identify a Dist manifest URL slot.
      - Ask for both the complete `https://.../dist.json` URL and its independently published SHA-256.
      - 'Depending on wording, likely operations are `add: pulled view` or `refresh: pulled views`.'
      - >-
          Do not put dist URL, local target, pull mechanics, or view registry entries in
          `-config/@sys.cell/cell.yaml`.

  - label: 'Sample slot values'
    items:
      - '<manifest-url>: `https://fs.db.team/driver.stripe/dist.json`'
      - '<manifest-url>: `https://fs.db.team/ui.components/dist.json`'
      - '<integrity>: publisher-provided `sha256-<exact-manifest-byte-hash>`; never derive it from the pull'
      - '<service-name>: `ui:static:views` for a sample static view service'
      - '<service-name>: `stripe:dev:fixture` for a sample Stripe fixture service'
      - '<service-name>: `cell:proxy` for a sample public proxy'
      - '<module> / <endpoint>: `jsr:@sys/driver-stripe/server/fixture` / `StripeFixture`'
      - '<config>: `./-config/@sys.driver-stripe/fixture.yaml`'
      - '<view>: `stripe.dev`, `hello`'

  - label: 'Descriptor shapes'
    items:
      - |-
          A Cell descriptor has this shape:
          ```yaml
          kind: cell
          version: 1
          name: <optional-cell-name>
          services:
            - name:
              use:
              from:
              config:
          tasks:
            - name:
              use:
              from:
              config:
          ```
      - Root `name`, service names, and task names are Cell descriptor IDs.
      - 'Root `version: 1` is the descriptor schema version, not a Cell release version.'
      - Owner config internals stay outside `-config/@sys.cell/cell.yaml`.

  - label: Owner reminders
    items: |
      Pulled view config is owned by `@sys/tools/pull`.
      Default static serving is owned by `@sys/tools/serve`.
      Proxy routing is owned by `@sys/http/server/proxy`.
      The descriptor may record a stable identity, services, tasks, endpoint refs, and owner config refs.

  - label: Source guardrail
    items:
      - >-
          Prefer root DSL, the matching operation chapter, this examples chapter, and owner
          `--help` before package source.
      - >-
          Source inspection is a last resort for public exports, types, or lifecycle/task
          contracts only.
