id: test
title: Workspace Test Runner
summary: >-
  Schedule tests; report truthful handoffs.

sections:
  - label: Baseline
    items:
      - >-
          `deno task test` is the canonical /sys test route and defaults to
          the topology-safe parallel scheduler.
      - >-
          `deno task test:seq` preserves sequential graph-order package
          execution with inherited stdio.
      - >-
          `Workspace.Run.test()` without an explicit strategy remains the
          semantic sequential API baseline; the root task wrapper owns the
          operator default.

  - label: Parallel control
    items:
      - '`deno task test:parallel` is the explicit parallel alias.'
      - '`deno task test -- --jobs=auto` uses the bounded automatic worker count.'
      - '`deno task test -- --jobs=<n>` accepts positive integers.'
      - >-
          `deno task test -- --parallel=false` selects the sequential strategy;
          prefer `deno task test:seq`.
      - >-
          Root `deno task test` injects `--parallel` before parsing when no
          explicit `--parallel` flag is present, so `--jobs` works on the
          default root route.
      - >-
          Parser/API calls still require a parallel strategy for `--jobs`;
          invalid flags must fail before packages run.
      - >-
          `--jobs=auto` is equivalent to omitting `--jobs` after selecting
          parallel; the resolved job count is printed in the run header.
      - >-
          Auto jobs are bounded: missing or invalid hardware information
          resolves to 4; known hardware resolves to
          `clamp(2, 8, floor(cpu / 2))`.
      - >-
          Parallelism removes avoidable idle time; speedup remains bounded by
          the slowest critical path.

  - label: Flag boundary
    items:
      - >-
          `@sys/workspace` runner flags live after the task separator:
          `deno task test -- --jobs=8`.
      - >-
          `deno task --jobs=8 test` is native Deno task-runner behavior,
          not the `@sys/workspace` package scheduler.
      - >-
          Do not mix native Deno task parallelism with `@sys/workspace`
          graph-truth semantics.

  - label: Scheduler truth
    items:
      - >-
          Parallel execution respects persisted workspace graph order and
          edges; it uses topological-frontier scheduling, not unordered package
          fan-out.
      - >-
          Missing package test tasks are terminal `skipped` outcomes that can
          unlock dependents.
      - >-
          Package failures remain visible in the live completed-results list and
          do not stop new launches; every selected package test runs through to
          a terminal result.
      - >-
          Dependency edges delay a dependent until its predecessors finish;
          predecessor failure does not suppress the dependent package test.
      - >-
          Final package rows and canonical failure selection follow graph order,
          not finish race order.

  - label: Output ownership
    items:
      - Sequential runs inherit child stdio for package-level debugging.
      - >-
          Parallel workers buffer child stdout/stderr and preserve both streams
          on `WorkspaceRun.Result`.
      - >-
          The parallel reporter renders scheduler-derived progress and a
          minimal live failed-package rerun index; it never renders failed-case
          identities, messages, excerpts, or buffered child streams.
      - >-
          For direct parallel API calls, `reporter: 'screen' | 'log'` explicitly
          selects terminal behavior; omission detects whether stdout is a
          terminal.
      - >-
          The root task owns final presentation: interactive parallel runs use
          screen reporter mode and a compact handoff; noninteractive parallel
          runs use log reporter mode and a full handoff; sequential runs retain
          `Workspace.Run.Fmt.result(...)`.

  - label: Failure handoff
    items:
      - >-
          `Workspace.Run.Fmt.handoff(result, { detail, terminal?, width? })`
          formats one deterministic final handoff; `detail` is `compact` or
          `full`.
      - >-
          A failed package finish immediately adds a minimal actionable item
          beneath the live completed-results grid, and that item persists while
          later packages complete.
      - >-
          Repair items follow persisted graph order and include failed packages
          only; blocked outcomes remain aggregate facts, not rerun targets.
      - >-
          Live and compact items contain exactly the package path, a positive
          observed failed-test count or process signal/exit fact, and the exact
          package-local rerun command.
      - >-
          Failed-case identities, messages, ANSI-free output excerpts, stdout,
          and stderr are full/log-only diagnostic evidence and never appear in
          live or compact output.
      - >-
          Observed failure counts without case records remain counts; unsupported
          or unavailable reports fall back to process signal or exit without
          invented test facts.
      - >-
          Width fitting may wrap the rerun command, but it must never truncate or
          rewrite `deno task --cwd ./<package-path> <task>`.
      - >-
          Full detail preserves the same minimal repair index, then adds bounded
          structured cases or conservative output evidence and every nonempty
          buffered stdout/stderr stream from failed packages.

  - label: Native test telemetry
    items:
      - >-
          Package scheduler truth is primary: runnable, running, passed, failed,
          skipped, blocked, and elapsed package state comes from the
          `@sys/workspace` scheduler events.
      - >-
          Native Deno test counts are optional final report facts collected for
          simple `deno test ...` package tasks through additive JUnit reports.
      - >-
          Deno does not expose a stable structured live test-case event stream;
          live rows must not invent current test-case progress from pretty output.
      - >-
          Report facts are capability-tagged as observed, unavailable, or
          unsupported. Unsupported composite or no-op package tasks are still
          successful package runs when their process succeeds.
      - >-
          `—` means no native test count was observed or applicable for that
          package; it is not zero tests.
      - >-
          Package process status remains authoritative for success and failure;
          parsed report facts must not override the child process result.
      - >-
          JUnit artifacts are written under a run-scoped temporary directory and
          cleaned best-effort after parsing; cleanup failure must not fail an
          otherwise valid package run.
